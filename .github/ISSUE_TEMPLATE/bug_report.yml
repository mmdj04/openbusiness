name: Relatar Bug
description: Reporte um bug no projeto
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar um bug! Preencha as informações abaixo.
  - type: textarea
    id: description
    attributes:
      label: Descrição do Bug
      description: Descreva o bug claramente.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para Reproduzir
      description: Passos para reproduzir o comportamento.
      placeholder: |
        1. Vá para '...'
        2. Clique em '...'
        3. Veja o erro
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento Esperado
      description: O que você esperava que acontecesse.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema Operacional
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Versão do Node.js
      placeholder: "ex: 20.11.0"
    validations:
      required: true
